<body>

<!-- NAV -->
<header class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="/" class="brand">
      <span class="brand-prompt">wajeh@qa</span><span class="brand-tilde">:~/apps$</span>
      <span class="brand-cursor">_</span>
    </a>

    <nav class="nav-links" id="nav-links">
      <a href="/" class="nav-link">./home</a>
      <a href="/#projects" class="nav-link">./projects</a>
      <a href="/#contact" class="nav-link">./contact</a>

      <span></span><span></span><span></span>

<main>

  <!-- MY APPS: cards are generated from js/apps-data.js (installers for Last Lie live in /downloads) -->
  <section id="apps" class="section apps-section apps-page" aria-labelledby="apps-title">
    <span id="games" class="anchor-alias" aria-hidden="true"></span>
    <div class="section-inner">
      <p class="section-kicker reveal">&gt; ls ./apps</p>
      <h1 class="section-title apps-title reveal" id="apps-title"><span class="apps-title-glow">MY APPS</span></h1>
      <p class="contact-sub reveal">Desktop software, games and web projects I build and publish.</p>

      <div class="apps-filters reveal" id="apps-filters" role="toolbar" aria-label="Filter apps"></div>

      <div class="apps-grid" id="apps-grid">
        <noscript>
          <div class="game-card">
            <h3 class="game-title">Awajeh 3D</h3>
            <p class="game-sub">Windows Desktop Application</p>
            <div class="game-downloads"><a href="/downloads/Awajeh3D-Setup.exe" class="btn btn-primary" download>Download for Windows ↓</a></div>
          </div>
          <div class="game-card">
            <h3 class="game-title">Last Lie Beta</h3>
            <div class="game-downloads">
              <a href="/downloads/LastLie-Setup.exe" class="btn btn-primary" download>Download for Windows ↓</a>
              <a href="/downloads/LastLie-Setup.run" class="btn btn-ghost" download>Download for Linux ↓</a>
            </div>
          </div>
        </noscript>
      </div>

      <p class="apps-back reveal"><a href="/" class="btn btn-ghost">← Back to portfolio</a></p>
    </div>
  </section>

</main>

<footer class="footer">

</footer>

<button id="back-to-top" class="back-to-top" aria-label="Back to top">↑</button>

  <div class="app-dialog-body"></div>
</dialog>
